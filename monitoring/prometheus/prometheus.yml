# ============================================================
# Prometheus : configuration Lumia
# Scrape les exporters sur le réseau privé lumia-internal.
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Règles d'alerte (voir alerts.yml)
rule_files:
  - /etc/prometheus/alerts.yml

# Routage des alertes vers Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus lui-même
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Métriques système du VPS (CPU, RAM, disque, réseau)
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # Métriques par conteneur (CPU, mémoire, restarts, état)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Grafana (métriques internes)
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # Healthcheck applicatif Lumia via blackbox "maison" :
  # /api/health ne renvoie pas de métriques Prometheus, donc on
  # surveille l'app via cAdvisor (conteneur up) + Uptime Kuma (HTTP externe).
