# ============================================================
# Alertmanager — routage des alertes Lumia vers Discord.
#
# Routage par sévérité :
#   critical → canal Discord, renotifié toutes les 30 min (urgence)
#   warning  → canal Discord, groupé, renotifié toutes les 4 h (info)
#
# Le webhook est lu depuis un FICHIER (discord_webhook, gitignoré)
# présent uniquement sur le VPS — aucun secret dans ce fichier.
# ============================================================

route:
  receiver: discord-warning
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: discord-critical
      repeat_interval: 30m

receivers:
  - name: discord-critical
    discord_configs:
      - webhook_url_file: /etc/alertmanager/discord_webhook
        title: "🚨 [CRITICAL] {{ .CommonAnnotations.summary }}"
        message: |
          {{ range .Alerts }}
          **{{ .Annotations.summary }}**
          {{ .Annotations.description }}
          Runbook : `{{ .Annotations.runbook }}`
          {{ end }}

  - name: discord-warning
    discord_configs:
      - webhook_url_file: /etc/alertmanager/discord_webhook
        title: "⚠️ [WARNING] {{ .CommonAnnotations.summary }}"
        message: |
          {{ range .Alerts }}
          **{{ .Annotations.summary }}**
          {{ .Annotations.description }}
          {{ end }}

# Ne pas spammer : si l'app est down, inutile d'alerter aussi
# sur le healthcheck warning correspondant.
inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname"]
