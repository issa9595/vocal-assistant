name: 🧹 Lint

on:
  workflow_call:

jobs:
  lint:
    name: 🧹 ESLint + TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit
