name: 🧹 Lint

on:
  workflow_call:

jobs:
  lint:
    name: 🧹 ESLint + TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # Gate sécurité : échoue si une dépendance de PROD a une vuln high/critical.
      # (Les vulns dev-only ne bloquent pas : elles ne partent pas en prod.)
      - name: Audit des dépendances (prod, high+)
        run: npm audit --omit=dev --audit-level=high
